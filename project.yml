# XcodeGen spec. The checked-in AirSteps.xcodeproj is generated from this;
# run `xcodegen` to regenerate it after adding files.
name: AirSteps
options:
  bundleIdPrefix: nl.studiocobalt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M6MXYGJ4C2
targets:
  AirSteps:
    type: application
    platform: iOS
    sources: [AirSteps, Shared]
    info:
      path: AirSteps/Info.plist
    entitlements:
      path: AirSteps/AirSteps.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiocobalt.AirSteps
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AirStepsWidgetExtension
        embed: true
  AirStepsWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [AirStepsWidget, Shared]
    info:
      path: AirStepsWidget/Info.plist
    entitlements:
      path: AirStepsWidget/AirStepsWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiocobalt.AirSteps.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
