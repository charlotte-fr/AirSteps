# XcodeGen spec. The checked-in AirSteps.xcodeproj is generated from this;
# run `xcodegen` to regenerate it after adding files. Info.plist and
# entitlements files are hand-written and referenced, never generated.
name: AirSteps
options:
  bundleIdPrefix: nl.studiocobalt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: M6MXYGJ4C2
targets:
  AirSteps:
    type: application
    platform: iOS
    sources: [AirSteps, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiocobalt.AirSteps
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AirSteps/Info.plist
        CODE_SIGN_ENTITLEMENTS: AirSteps/AirSteps.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: AirStepsWidgetExtension
        embed: true
  AirStepsWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [AirStepsWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.studiocobalt.AirSteps.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AirStepsWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AirStepsWidget/AirStepsWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  AirSteps:
    build:
      targets:
        AirSteps: all
    run:
      config: Debug
    archive:
      config: Release
